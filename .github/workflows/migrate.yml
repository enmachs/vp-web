# Apply Prisma migrations to production Neon over HTTPS (port 443).
#
# `prisma migrate deploy` uses Prisma's Rust engine over TCP :5432, which
# hangs from some networks (P1001). This job runs `npm run migrate:http`
# instead, the same path as the Neon SQL Editor.
#
# First production apply already ran on main (9 migrations, empty Neon).
# The apply step is commented out so later pushes do not touch the schema.
# Uncomment it when you add files under migrations/, then comment it out
# again after that run succeeds.
#
# Required GitHub Actions secret: DATABASE_URL_UNPOOLED (Neon direct URL,
# unquoted), stored on the `production` environment — not a repo-level
# secret. The job sets `environment: production` so that value is injected.
# Do not use the pooled DATABASE_URL. Vercel builds stay migrate-free.

name: Migrate production Neon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "migrations/**"
      - "schema.prisma"
      - "scripts/migrate-http.ts"
      - ".github/workflows/migrate.yml"

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # One-shot first apply: done on main 2026-09-12 (9 migrations).
      # Uncomment to apply new migrations, then comment out again.
      # - name: Apply pending migrations
      #   run: npm run migrate:http
      #   env:
      #     DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
